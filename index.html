<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SPACE_RAIDER_ULTIMATE</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #020205; --accent: #00f2ff; --admin: #ff0055; --glass: rgba(5, 5, 15, 0.9); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Courier New', monospace; overflow: hidden; }
        
        #hud { position: fixed; inset: 0; pointer-events: none; z-index: 100; display: none; flex-direction: column; justify-content: space-between; padding: 25px; }
        .panel { pointer-events: all; background: var(--glass); padding: 15px; border-radius: 5px; border: 1px solid var(--accent); }
        #chat-input { width: 100%; background: #000; color: var(--accent); border: 1px solid var(--accent); padding: 10px; margin-top: 10px; outline: none; }
        
        #entry-screen { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .login-box { text-align: center; border: 2px solid var(--accent); padding: 40px; background: #050505; }
        input { padding: 12px; margin: 10px; background: #111; color: #fff; border: 1px solid #333; text-align: center; }
        button { padding: 12px 30px; background: var(--accent); color: #000; border: none; cursor: pointer; font-weight: 900; }
        
        /* THE BIG ANNOUNCEMENT BANNER */
        #announcement { position: fixed; top: -120px; left: 50%; transform: translateX(-50%); background: #f59e0b; color: #000; padding: 15px 50px; border-radius: 0 0 15px 15px; font-weight: 900; z-index: 3000; transition: 0.5s; text-transform: uppercase; border: 2px solid #000; }
        
        #cinematic-text { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 50; pointer-events: none; display: none; width: 80%; }
    </style>
</head>
<body>

<div id="announcement">SYSTEM BROADCAST</div>

<div id="entry-screen">
    <div class="login-box">
        <h1 style="color:var(--accent); letter-spacing: 5px;">SPACE RAIDER</h1>
        <input type="text" id="username" placeholder="CALLSIGN"><br>
        <input type="password" id="pass" placeholder="AUTH_CODE"><br>
        <button onclick="init()">SYSTEM_LINK</button>
    </div>
</div>

<div id="cinematic-text">
    <div id="speaker" style="color:var(--admin); font-weight: bold; font-size: 18px; margin-bottom: 10px;"></div>
    <div id="line" style="font-size: 24px; text-shadow: 0 0 10px var(--accent);"></div>
</div>

<canvas id="canvas"></canvas>
<audio id="raider-music" loop><source src="https://cdn.pixabay.com/audio/2022/10/25/audio_24905d8f6d.mp3" type="audio/mpeg"></audio>

<div id="hud">
    <div style="display:flex; justify-content: space-between;">
        <div class="panel">📡 LINK: <span id="status" style="color:var(--accent)">SEARCHING</span></div>
        <div id="admin-panel" class="panel" style="display:none; color:var(--admin); border-color:var(--admin); font-size: 10px;">
            RAIDER ADMIN: /announce [txt] | /story | /shockwave | /clear
        </div>
    </div>
    <div class="panel" style="width: 380px;">
        <div id="msgs" style="height: 100px; overflow-y:auto; font-size:12px; margin-bottom: 5px; border-bottom: 1px solid #222;"></div>
        <input type="text" id="chat-input" placeholder="Type command...">
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const music = document.getElementById('raider-music');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;

    let myPos = { x: 0, y: 0, name: "", color: "#00f2ff", adm: false, msg: "" };
    let players = {}, conns = [], stars = [], storyPhase = 0, storyTime = 0, shake = 0, waveR = 0;
    let bigMeteor = { x: 0, y: 0 };

    for(let i=0; i<150; i++) stars.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2 + 1});

    function init() {
        myPos.name = document.getElementById('username').value || "Raider";
        if(document.getElementById('pass').value === "BIB1") { 
            myPos.adm = true; myPos.color = "#ff0055"; 
            document.getElementById('admin-panel').style.display = "block";
        }
        document.getElementById('entry-screen').style.display = "none";
        document.getElementById('hud').style.display = "flex";
        startNet();
    }

    function startNet() {
        const ID = "raider-ultimate-2026";
        const host = new Peer(ID);
        host.on('open', () => { document.getElementById('status').innerText = "HOST"; });
        host.on('connection', setup);
        const guest = new Peer();
        guest.on('open', () => {
            const c = guest.connect(ID);
            c.on('open', () => { setup(c); document.getElementById('status').innerText = "LINKED"; });
        });
    }

    function setup(c) {
        conns.push(c);
        c.on('data', d => {
            if(d.type === 'sync') players[d.id] = d.p;
            if(d.type === 'story') triggerStory();
            if(d.type === 'shock') waveR = 1;
            if(d.type === 'bc') showBC(d.txt);
            if(d.type === 'reset') resetWorld();
        });
    }

    function showBC(t) {
        const el = document.getElementById('announcement');
        el.innerText = t; el.style.top = "0px";
        setTimeout(() => { el.style.top = "-120px"; }, 4000);
    }

    function triggerStory() {
        storyPhase = 1; storyTime = Date.now();
        bigMeteor = { x: canvas.width + 600, y: -400 };
        music.currentTime = 0; music.play();
        document.getElementById('cinematic-text').style.display = "block";
    }

    function resetWorld() {
        storyPhase = 0; shake = 0; waveR = 0;
        music.pause(); music.currentTime = 0;
        document.getElementById('cinematic-text').style.display = "none";
        ctx.setTransform(1,0,0,1,0,0);
    }

    const script = [
        ["PILOT ALPHA", "Sector lockdown engaged. Target: The Satellite Cluster."],
        ["PILOT BETA", "Wait! We haven't evacuated the Raiders yet!"],
        ["PILOT ALPHA", "Too late. The Meteor is already in the atmosphere. Brace!"]
    ];

    window.onmousemove = e => { myPos.x = e.clientX; myPos.y = e.clientY; };
    window.onkeydown = e => {
        if(e.key === 'Escape') { resetWorld(); conns.forEach(c => c.send({type:'reset'})); }
        if(e.key === 'Enter') {
            const inp = document.getElementById('chat-input');
            const val = inp.value.trim();
            if(!val) return;
            
            if(val === '/story' && myPos.adm) { triggerStory(); conns.forEach(c => c.send({type:'story'})); }
            else if(val === '/shockwave' && myPos.adm) { waveR = 1; conns.forEach(c => c.send({type:'shock'})); }
            else if(val.startsWith('/announce ') && myPos.adm) { 
                let t = val.replace('/announce ', '');
                showBC(t); conns.forEach(c => c.send({type:'bc', txt: t}));
            }
            else if(val === '/clear' && myPos.adm) { resetWorld(); conns.forEach(c => c.send({type:'reset'})); }
            else { myPos.msg = val; setTimeout(()=>myPos.msg="", 4000); }
            inp.value = "";
        }
    };

    function loop() {
        if(shake > 0) { ctx.save(); ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); }
        ctx.fillStyle = "#020205"; ctx.fillRect(0,0,canvas.width,canvas.height);
        
        ctx.fillStyle = "#fff";
        stars.forEach(s => { s.y += s.s * 0.5; if(s.y > canvas.height) s.y = 0; ctx.fillRect(s.x, s.y, s.s, s.s); });

        // SHOCKWAVE EFFECT
        if(waveR > 0) {
            waveR += 20;
            ctx.strokeStyle = `rgba(0, 242, 255, ${1 - waveR/canvas.width})`;
            ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, waveR, 0, 7); ctx.stroke();
            if(waveR > canvas.width) waveR = 0;
        }

        if(storyPhase > 0) {
            let elap = Date.now() - storyTime;
            if(storyPhase === 1) {
                let idx = elap < 3000 ? 0 : elap < 6000 ? 1 : 2;
                document.getElementById('speaker').innerText = script[idx][0];
                document.getElementById('line').innerText = script[idx][1];
                if(elap > 9000) { storyPhase = 2; storyTime = Date.now(); document.getElementById('cinematic-text').style.display = "none"; }
            } else if(storyPhase === 2) {
                shake = 25; bigMeteor.x -= 40; bigMeteor.y += 25;
                let g = ctx.createRadialGradient(bigMeteor.x, bigMeteor.y, 0, bigMeteor.x, bigMeteor.y, 350);
                g.addColorStop(0, '#fff'); g.addColorStop(0.2, '#ff0'); g.addColorStop(1, 'transparent');
                ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bigMeteor.x, bigMeteor.y, 350, 0, 7); ctx.fill();
                if(elap > 3000) { ctx.fillStyle = `rgba(255,255,255,${(elap-3000)/1000})`; ctx.fillRect(0,0,canvas.width,canvas.height); }
                if(elap > 4000) { storyPhase = 3; storyTime = Date.now(); }
            } else if(storyPhase === 3) {
                shake = 0; ctx.fillStyle = "#000"; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = "#fff"; ctx.font = "italic 24px serif"; ctx.textAlign = "center";
                ctx.fillText("Hey, you. You're finally awake.", canvas.width/2, canvas.height/2);
                if(elap > 5000) storyPhase = 0;
            }
        }

        players['me'] = myPos;
        for(let id in players) {
            let p = players[id];
            ctx.shadowBlur = 15; ctx.shadowColor = p.color;
            ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, 7); ctx.fill();
            ctx.shadowBlur = 0; ctx.fillStyle = "#fff"; ctx.font = "bold 12px Courier"; ctx.textAlign = "center";
            ctx.fillText(p.name, p.x, p.y + 30);
            if(p.msg) ctx.fillText(p.msg, p.x, p.y - 30);
        }

        conns.forEach(c => c.send({type:'sync', id: myPos.name, p: myPos}));
        if(shake > 0) ctx.restore();
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
