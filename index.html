<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BETALOPIX | Keyless Lobby</title>
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <style>
        :root { --bg: #050608; --teal: #00f2ff; --purple: #bd00ff; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }

        /* AUTH LAYER */
        #auth-layer { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: flex; justify-content: center; align-items: center; }
        .card { background: #111; padding: 40px; border-radius: 20px; border: 1px solid #333; text-align: center; }
        input { background: #000; border: 1px solid #444; color: white; padding: 12px; margin: 10px; border-radius: 8px; width: 220px; }
        .btn { background: linear-gradient(45deg, var(--teal), var(--purple)); border: none; color: white; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* GAME WORLD */
        #game-layer { display: none; width: 100vw; height: 100vh; perspective: 1000px; background: #000; }
        .baseplate { width: 4000px; height: 4000px; background-image: radial-gradient(#222 1px, transparent 1px); background-size: 50px 50px; transform: rotateX(60deg) translate(-2000px, -2000px); position: absolute; top: 50%; left: 50%; }
        
        /* AVATARS */
        .avatar { position: absolute; transform-style: preserve-3d; transition: 0.2s ease-out; }
        .cube { width: 40px; height: 40px; background: var(--teal); border: 2px solid white; box-shadow: 0 0 15px var(--teal); }
        .tag { position: absolute; top: -30px; width: 100px; left: -30px; text-align: center; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .crown { position: absolute; width: 44px; height: 12px; background: gold; top: -12px; clip-path: polygon(0% 100%, 0% 0%, 25% 50%, 50% 0%, 75% 50%, 100% 0%, 100% 100%); }
    </style>
</head>
<body>

    <div id="auth-layer">
        <div class="card">
            <h1>BETALOPIX</h1>
            <input type="text" id="u-name" placeholder="Architect Name">
            <button class="btn" onclick="initLobby()">ENTER LOBBY</button>
        </div>
    </div>

    <div id="game-layer">
        <div class="baseplate"></div>
        <div id="players-container"></div>
    </div>

    <script>
        // Use a public relay (Zero Setup Required)
        const gun = Gun(['https://gun-manhattan.herokuapp.com/gun']);
        const lobby = gun.get('betalopix-v1-lobby');
        
        let myName = "";
        let myPos = { x: 0, y: 0 };

        function initLobby() {
            myName = document.getElementById('u-name').value.trim();
            if(!myName) return alert("Enter Name");

            document.getElementById('auth-layer').style.display = 'none';
            document.getElementById('game-layer').style.display = 'block';

            // 1. Tell the lobby I'm here
            lobby.get(myName).put({ x: 0, y: 0, lastSeen: Date.now() });

            // 2. Watch the lobby for ALL players
            lobby.map().on((data, name) => {
                if(!data) return;
                // If they haven't moved in 10 seconds, ignore them (simple cleanup)
                if(Date.now() - data.lastSeen > 10000) return removeAvatar(name);
                
                updateAvatar(name, data.x, data.y);
            });
        }

        function spawnAvatar(name) {
            const container = document.getElementById('players-container');
            const div = document.createElement('div');
            div.id = 'p-' + name;
            div.className = 'avatar';
            
            let isAdm = name.toLowerCase() === 'betalopix';
            let color = isAdm ? 'var(--purple)' : 'var(--teal)';
            let crown = isAdm ? '<div class="crown"></div>' : '';

            div.innerHTML = `<div class="tag">${name}</div><div class="cube" style="background:${color}">${crown}</div>`;
            container.appendChild(div);
            return div;
        }

        function updateAvatar(name, x, y) {
            let el = document.getElementById('p-' + name);
            if(!el) el = spawnAvatar(name);
            el.style.left = `calc(50% + ${x}px)`;
            el.style.top = `calc(50% + ${y}px)`;
        }

        function removeAvatar(name) {
            const el = document.getElementById('p-' + name);
            if(el) el.remove();
        }

        // --- CONTROLS ---
        document.addEventListener('keydown', (e) => {
            if(!myName) return;
            const s = 25;
            if(e.key === 'w') myPos.y -= s;
            if(e.key === 's') myPos.y += s;
            if(e.key === 'a') myPos.x -= s;
            if(e.key === 'd') myPos.x += s;

            // Update the "Global Brain"
            lobby.get(myName).put({ x: myPos.x, y: myPos.y, lastSeen: Date.now() });
        });

        // Cleanup my data when I close the tab
        window.onbeforeunload = () => {
            lobby.get(myName).put(null);
        };
    </script>
</body>
</html>
