<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BETALOPIX | Secure Portal</title>
    <style>
        :root { --bg: #050608; --beta-teal: #00f2ff; --lopix-purple: #bd00ff; --glass: rgba(255,255,255,0.05); }
        body, html { margin: 0; padding: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }

        /* --- AUTH LAYER --- */
        #auth-layer { position: fixed; inset: 0; z-index: 2000; background: var(--bg); display: flex; justify-content: center; align-items: center; }
        .portal-card { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 30px; width: 320px; text-align: center; }
        .logo-text { font-size: 2.5rem; font-weight: 900; background: linear-gradient(to right, var(--beta-teal), var(--lopix-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        
        input { width: 100%; box-sizing: border-box; background: #000; border: 1px solid #333; padding: 15px; border-radius: 12px; color: white; margin-bottom: 15px; outline: none; }
        input:focus { border-color: var(--beta-teal); }
        
        .btn-main { width: 100%; padding: 15px; border: none; border-radius: 12px; background: linear-gradient(45deg, var(--beta-teal), var(--lopix-purple)); color: white; font-weight: bold; cursor: pointer; }
        .mode-toggle { font-size: 0.8rem; color: #888; margin-top: 15px; cursor: pointer; text-decoration: underline; }

        /* --- HOME LAYER --- */
        #home-layer { display: none; height: 100vh; flex-direction: column; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(5,6,8,0.9); border-bottom: 1px solid var(--glass); }
        .dashboard { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .badge { font-size: 0.6rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; margin: 0 5px; }
        .badge-admin { background: var(--lopix-purple); box-shadow: 0 0 10px var(--lopix-purple); }
        .badge-og { background: gold; color: black; }

        /* --- GAME LAYER --- */
        #game-layer { display: none; position: fixed; inset: 0; background: #000; z-index: 500; }
        .viewport { width: 100%; height: 100%; perspective: 1000px; display: flex; align-items: center; justify-content: center; }
        .baseplate { width: 2000px; height: 2000px; background: #111; background-image: radial-gradient(#333 1px, transparent 1px); background-size: 50px 50px; transform: rotateX(65deg); border: 2px solid #222; }
        .avatar { width: 40px; height: 40px; position: absolute; transform-style: preserve-3d; transition: 0.1s linear; }
        .cube { width: 40px; height: 40px; background: var(--beta-teal); border: 2px solid white; box-shadow: 0 0 15px var(--beta-teal); }
    </style>
</head>
<body>

    <div id="auth-layer">
        <div class="portal-card">
            <div class="logo-text">BETALOPIX</div>
            <h3 id="auth-mode-title">Architect Login</h3>
            <input type="text" id="user-in" placeholder="Username">
            <input type="password" id="pass-in" placeholder="Security Key">
            <button class="btn-main" id="auth-btn" onclick="handleAuth()">INITIALIZE</button>
            <div class="mode-toggle" onclick="toggleAuthMode()" id="mode-text">Need an identity? Create Account</div>
        </div>
    </div>

    <div id="home-layer">
        <nav>
            <div class="logo-text" style="font-size: 1.2rem;">BETALOPIX</div>
            <div id="nav-user" style="font-weight: bold; color: var(--beta-teal);"></div>
        </nav>
        <div class="dashboard">
            <h1 id="welcome-msg">Welcome</h1>
            <div id="user-badges" style="margin-bottom: 20px;"></div>
            <button class="btn-main" style="width: 250px;" onclick="startGame()">ENTER BASEPLATE</button>
            <p onclick="location.reload()" style="color: red; cursor: pointer; margin-top: 30px;">LOGOUT</p>
        </div>
    </div>

    <div id="game-layer">
        <div class="viewport">
            <div class="baseplate"></div>
            <div id="player" class="avatar">
                <div id="player-cube" class="cube"></div>
                <div id="player-tag" style="position: absolute; top: -40px; width: 120px; left: -40px; text-align: center; font-weight: bold;">User</div>
            </div>
        </div>
    </div>

    <script>
        let isSignUpMode = false;
        let db = JSON.parse(localStorage.getItem('bx_global_db') || '[]');
        let session = null;

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-mode-title').innerText = isSignUpMode ? "Create Identity" : "Architect Login";
            document.getElementById('mode-text').innerText = isSignUpMode ? "Already an Architect? Login" : "Need an identity? Create Account";
            document.getElementById('auth-btn').innerText = isSignUpMode ? "CREATE & ENTER" : "INITIALIZE";
        }

        function handleAuth() {
            const u = document.getElementById('user-in').value.trim();
            const p = document.getElementById('pass-in').value;
            if(!u || !p) return alert("Fill all fields.");

            let user = db.find(x => x.user.toLowerCase() === u.toLowerCase());

            if (isSignUpMode) {
                // --- SIGN UP LOGIC ---
                if (user) return alert("⚠️ Identity already exists! Please Login instead.");
                
                user = { user: u, pass: p, badges: [] };
                if (u.toLowerCase() === 'betalopix') user.badges.push("ADMIN", "OG");
                else if (db.length < 10) user.badges.push("OG");

                db.push(user);
                localStorage.setItem('bx_global_db', JSON.stringify(db));
                alert("Account Created!");
            } else {
                // --- LOGIN LOGIC ---
                if (!user) return alert("⚠️ Identity not found! Please create an account.");
                if (user.pass !== p) return alert("⚠️ INCORRECT KEY! Access Denied.");
            }

            // If we get here, Auth is successful
            session = user;
            document.getElementById('auth-layer').style.display = 'none';
            document.getElementById('home-layer').style.display = 'flex';
            updateUI();
        }

        function updateUI() {
            document.getElementById('nav-user').innerText = session.user;
            document.getElementById('welcome-msg').innerText = "Welcome, " + session.user;
            document.getElementById('user-badges').innerHTML = session.badges.map(b => `<span class="badge badge-${b.toLowerCase()}">${b}</span>`).join('');
        }

        function startGame() {
            document.getElementById('home-layer').style.display = 'none';
            document.getElementById('game-layer').style.display = 'block';
            document.getElementById('player-tag').innerText = session.user;
            if(session.badges.includes("ADMIN")) document.getElementById('player-cube').style.background = "var(--lopix-purple)";
        }

        // --- WASD CONTROLS ---
        let posX = 0, posY = 0;
        document.addEventListener('keydown', (e) => {
            if(document.getElementById('game-layer').style.display !== 'block') return;
            const s = 20;
            if(e.key.toLowerCase() === 'w') posY -= s;
            if(e.key.toLowerCase() === 's') posY += s;
            if(e.key.toLowerCase() === 'a') posX -= s;
            if(e.key.toLowerCase() === 'd') posX += s;
            document.getElementById('player').style.transform = `translate3d(${posX}px, ${posY}px, 0)`;
        });
    </script>
</body>
</html>
