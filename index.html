<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THE MASSIVE LOBBY</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #050505; --accent: #00ff41; --panel: rgba(0, 20, 0, 0.95); }
        body { margin: 0; background: var(--bg); color: var(--accent); font-family: 'Courier New', monospace; overflow: hidden; }
        #login-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .login-box { border: 2px solid var(--accent); padding: 30px; text-align: center; background: var(--panel); box-shadow: 0 0 20px var(--accent); }
        #ui { position: absolute; inset: 0; pointer-events: none; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .box { pointer-events: all; background: var(--panel); border: 1px solid var(--accent); padding: 15px; border-radius: 4px; }
        .shop-btn { background: none; border: 1px solid var(--accent); color: var(--accent); cursor: pointer; padding: 5px 10px; margin: 2px; }
        #chat-input { background: black; border: 1px solid var(--accent); color: var(--accent); padding: 10px; width: 100%; box-sizing: border-box; display: none; }
        #chat-input.active { display: block; }
        #messages { height: 120px; overflow-y: auto; font-size: 0.8rem; margin-bottom: 5px; }
        canvas { display: block; }
        input { background: #000; color: #0f0; border: 1px solid #0f0; padding: 10px; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h1>LOBBY.EXE ONLINE</h1>
        <input type="text" id="username-input" placeholder="USERNAME" maxlength="12"><br><br>
        <button onclick="login()" style="background:#0f0; border:none; padding:15px 30px; cursor:pointer; font-weight:bold">SYNC TO LOBBY</button>
    </div>
</div>

<audio id="radio" loop><source src="https://stream.zeno.fm/f3v5u8p74eruv" type="audio/mpeg"></audio>
<canvas id="canvas"></canvas>

<div id="ui" style="display:none">
    <div style="display: flex; justify-content: space-between;">
        <div class="box">
            USER: <span id="display-name">---</span><br>
            ROOM: <span style="color:#fff">GLOBAL_MAIN</span>
        </div>
        <div class="box">
            <button id="music-btn" onclick="playMusic()" style="background:none; color:#0f0; border:1px solid #0f0; cursor:pointer; padding:10px">🎵 LOFI: OFF</button>
            <div style="margin-top:10px">
                SKIN: 
                <button class="shop-btn" onclick="setSkin('square')">SQRE</button>
                <button class="shop-btn" onclick="setSkin('circle')">CIRC</button>
                <button class="shop-btn" onclick="setSkin('ghost')">GHST</button>
            </div>
        </div>
    </div>

    <div class="box" style="width: 350px;">
        <div id="messages">SYSTEM: PRESS ENTER TO CHAT</div>
        <input type="text" id="chat-input" placeholder="TYPE...">
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const radio = document.getElementById('radio');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;

    let myName = localStorage.getItem('username') || "";
    let mySkin = "square";
    let myColor = `hsl(${Math.random()*360}, 100%, 50%)`;
    
    // THE SECRET SAUCE: Fixed ID for the Lobby Host
    const LOBBY_ID = "lit-lofi-global-lobby-999"; 
    let peer = new Peer(); 
    let conns = [];
    let players = {};
    let myPos = { x: canvas.width/2, y: canvas.height/2, color: myColor, name: myName, skin: mySkin, msg: "" };

    function login() {
        const val = document.getElementById('username-input').value;
        if(!val) return;
        myName = val;
        localStorage.setItem('username', myName);
        myPos.name = myName;
        document.getElementById('display-name').innerText = myName;
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('ui').style.display = 'flex';
        
        initNetwork();
    }

    function initNetwork() {
        // First, try to be the Lobby Host
        const masterPeer = new Peer(LOBBY_ID);

        masterPeer.on('open', () => {
            console.log("You are the Lobby Host.");
            setupLobbyHandlers(masterPeer);
        });

        masterPeer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                // Someone is already the host, so we join them
                console.log("Lobby exists. Joining...");
                const clientPeer = new Peer();
                clientPeer.on('open', () => {
                    const conn = clientPeer.connect(LOBBY_ID);
                    setupConn(conn);
                    conns.push(conn);
                });
            }
        });
    }

    function setupLobbyHandlers(p) {
        p.on('connection', conn => {
            conns.push(conn);
            setupConn(conn);
        });
    }

    function setupConn(c) {
        c.on('data', d => {
            if(d.type === 'sync') players[c.peer || LOBBY_ID] = d.pos;
            if(d.type === 'chat') addMsg(d.name, d.text);
        });
    }

    function setSkin(s) { myPos.skin = s; }
    function playMusic() {
        if(radio.paused) { radio.play(); document.getElementById('music-btn').innerText = "🎵 LOFI: ON"; }
        else { radio.pause(); document.getElementById('music-btn').innerText = "🎵 LOFI: OFF"; }
    }

    // CHAT (ENTER -> TYPE -> ENTER)
    const chatIn = document.getElementById('chat-input');
    let typing = false;
    window.onkeydown = e => {
        if(e.key === 'Enter') {
            if(!typing) { typing = true; chatIn.classList.add('active'); chatIn.focus(); }
            else {
                if(chatIn.value.trim()) {
                    conns.forEach(c => c.send({type:'chat', name: myName, text: chatIn.value}));
                    addMsg(myName, chatIn.value);
                    myPos.msg = chatIn.value;
                    setTimeout(() => { if(myPos.msg === chatIn.value) myPos.msg = ""; }, 3000);
                }
                chatIn.value = ""; chatIn.classList.remove('active'); chatIn.blur();
                typing = false;
            }
        }
    };

    function addMsg(u, t) {
        const m = document.getElementById('messages');
        m.innerHTML += `<div><b>${u}:</b> ${t}</div>`;
        m.scrollTop = 999;
    }

    const mouse = { x: canvas.width/2, y: canvas.height/2 };
    window.onmousemove = e => { mouse.x = e.clientX; mouse.y = e.clientY; };

    function loop() {
        ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        myPos.x += (mouse.x - myPos.x) * 0.05;
        myPos.y += (mouse.y - myPos.y) * 0.05;
        
        conns.forEach(c => c.send({type:'sync', pos: myPos}));
        players['me'] = myPos;

        for(let id in players) {
            let p = players[id];
            ctx.shadowBlur = 15; ctx.shadowColor = p.color;
            ctx.fillStyle = p.color;
            ctx.strokeStyle = p.color;
            
            if(p.skin === 'square') ctx.fillRect(p.x-10, p.y-10, 20, 20);
            if(p.skin === 'circle') { ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, 7); ctx.fill(); }
            if(p.skin === 'ghost') { ctx.lineWidth = 2; ctx.strokeRect(p.x-12, p.y-12, 24, 24); }
            
            ctx.shadowBlur = 0;
            ctx.font = "12px monospace"; ctx.textAlign = "center";
            ctx.fillText(p.name || "GUEST", p.x, p.y + 30);
            if(p.msg) ctx.fillText(p.msg, p.x, p.y - 30);
        }
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
