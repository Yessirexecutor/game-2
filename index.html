<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VIBE_RECOVERY_FINAL</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #020205; --accent: #8b5cf6; --admin: #f59e0b; --glass: rgba(10, 10, 20, 0.95); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* HUD RECOVERY */
        #hud { position: fixed; inset: 0; pointer-events: none; z-index: 100; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .panel { pointer-events: all; background: var(--glass); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        #chat-input { width: 300px; background: #000; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 8px; outline: none; }
        
        #entry-screen { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        input { padding: 12px; margin: 5px; border-radius: 8px; border: none; text-align: center; }
        button { padding: 12px 24px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="entry-screen">
    <div style="text-align: center;">
        <h1 style="color:var(--accent)">RECOVERY LINK</h1>
        <input type="text" id="username" placeholder="NAME"><br>
        <input type="password" id="pass" placeholder="KEY"><br>
        <button onclick="init()">FORCE RE-ENTRY</button>
    </div>
</div>

<canvas id="canvas"></canvas>
<audio id="bg-music" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<div id="hud" style="display:none">
    <div class="panel" style="width: fit-content;">
        <b style="color:var(--admin)">ADMIN RECOVERY ACTIVE</b><br>
        <small>Press ESC to Kill All Music/Events</small>
    </div>
    <div class="panel" style="width: fit-content;">
        <div id="messages" style="height:100px; overflow-y:auto; font-size:12px;"></div>
        <input type="text" id="chat-input" placeholder="Type /clear to reset...">
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const music = document.getElementById('bg-music');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;

    let myPos = { x: canvas.width/2, y: canvas.height/2, name: "", color: "#8b5cf6", admin: false };
    let players = {}, conns = [], storyPhase = 0, mode = null;

    function init() {
        myPos.name = document.getElementById('username').value || "User";
        if(document.getElementById('pass').value === "BIB1") { myPos.admin = true; myPos.color = "#f59e0b"; }
        document.getElementById('entry-screen').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        startNet();
    }

    function startNet() {
        const peer = new Peer("vibe-recovery-zone");
        peer.on('open', () => setup(peer));
        peer.on('connection', c => {
            conns.push(c);
            c.on('data', d => {
                if(d.type === 'sync') players[c.peer] = d.pos;
                if(d.type === 'reset') nuclearReset();
            });
        });
        // Connect to host if exists
        const guest = new Peer();
        guest.on('open', () => {
            const c = guest.connect("vibe-recovery-zone");
            c.on('open', () => { conns.push(c); setup(c); });
        });
    }

    function setup(c) {
        c.on('data', d => { if(d.type === 'sync') players[d.id] = d.pos; });
    }

    // NUCLEAR RESET FUNCTION
    function nuclearReset() {
        storyPhase = 0;
        mode = null;
        music.pause();
        music.currentTime = 0;
        ctx.globalAlpha = 1.0;
        ctx.setTransform(1, 0, 0, 1, 0, 0); // Kill any shake
        console.log("RECOVERY COMPLETE");
    }

    window.onkeydown = e => {
        if(e.key === 'Escape') nuclearReset();
        if(e.key === 'Enter') {
            const inp = document.getElementById('chat-input');
            if(inp.value === '/clear' && myPos.admin) {
                nuclearReset();
                conns.forEach(c => c.send({type:'reset'}));
            }
            inp.value = "";
        }
    };

    window.onmousemove = e => {
        myPos.x = e.clientX;
        myPos.y = e.clientY;
    };

    function loop() {
        // ALWAYS clear with solid background to prevent flickering
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = "#020205";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // ALWAYS draw player no matter what phase
        players['me'] = myPos;
        for(let id in players) {
            const p = players[id];
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 15, 0, 7);
            ctx.fill();
            ctx.fillStyle = "white";
            ctx.fillText(p.name, p.x - 10, p.y + 30);
        }

        conns.forEach(c => c.send({type:'sync', pos: myPos, id: 'me'}));
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
