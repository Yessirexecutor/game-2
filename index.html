<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VIBE_WORLD_PC_REDUX</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #020205; --accent: #8b5cf6; --admin: #f59e0b; --glass: rgba(10, 10, 20, 0.8); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
        
        /* Smooth Entry Overlay */
        #entry-screen { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; align-items: center; justify-content: center; transition: opacity 0.8s; }
        .glass-card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 24px; text-align: center; backdrop-filter: blur(20px); width: 350px; }
        
        /* Game Interface */
        #hud { position: absolute; inset: 0; pointer-events: none; padding: 30px; display: none; flex-direction: column; justify-content: space-between; z-index: 10; }
        .panel { pointer-events: all; background: var(--glass); border: 1px solid rgba(255,255,255,0.05); padding: 15px 25px; border-radius: 16px; backdrop-filter: blur(10px); }
        
        /* Chat System */
        #chat-zone { width: 380px; }
        #messages { height: 180px; overflow-y: auto; font-size: 13px; margin-bottom: 12px; scrollbar-width: none; mask-image: linear-gradient(to top, black 80%, transparent); }
        #chat-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 10px; outline: none; transition: 0.3s; }
        #chat-input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); }

        /* Admin HUD */
        #admin-controls { position: absolute; top: 30px; right: 30px; border-color: var(--admin); display: none; }
        .cmd-hint { color: var(--admin); font-size: 11px; font-family: monospace; margin-top: 5px; opacity: 0.7; }

        #announcement { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: var(--admin); color: #000; padding: 15px 40px; border-radius: 0 0 20px 20px; font-weight: 900; letter-spacing: 1px; transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1); z-index: 3000; }
        
        canvas { display: block; }
        input[type="text"], input[type="password"] { width: 100%; background: #000; color: #fff; border: 1px solid #333; padding: 12px; border-radius: 10px; margin-bottom: 15px; text-align: center; }
        button { width: 100%; background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { filter: brightness(1.2); transform: translateY(-2px); }
    </style>
</head>
<body>

<div id="announcement">SERVER MESSAGE</div>

<div id="entry-screen">
    <div class="glass-card">
        <h1 style="margin-top:0; letter-spacing: -1px; color: var(--accent);">VIBE REDUX</h1>
        <input type="text" id="username" placeholder="DISPLAY NAME" maxlength="15">
        <input type="password" id="pass" placeholder="SECURITY KEY">
        <button onclick="init()">CONNECT TO INSTANCE</button>
    </div>
</div>

<canvas id="canvas"></canvas>

<div id="hud">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div class="panel">
            <span style="opacity:0.4; font-size:10px; font-weight:800; text-transform:uppercase;">Network Status</span><br>
            <b id="status-text" style="color:var(--accent)">LINKING...</b>
        </div>
        
        <div id="admin-controls" class="panel">
            <span style="color:var(--admin); font-size:10px; font-weight:800;">ADMIN CONSOLE ACTIVE</span>
            <div class="cmd-hint">Commands: /announce, /meteors, /nebula, /vortex, /clear</div>
        </div>
    </div>

    <div id="chat-zone" class="panel">
        <div id="messages"></div>
        <input type="text" id="chat-input" placeholder="Type message or command...">
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;

    let myPos = { x: canvas.width/2, y: canvas.height/2, name: "", color: "#8b5cf6", admin: false, msg: "" };
    let stars = [], meteors = [], players = {}, conns = [], peer = new Peer(), mode = null;
    let isAdmin = false, hue = 0;

    // Background Stars (React to movement)
    for(let i=0; i<250; i++) stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, z: Math.random()*2 + 1 });

    function init() {
        const name = document.getElementById('username').value;
        const pass = document.getElementById('pass').value;
        if(!name) return;

        myPos.name = name;
        if(pass === "BIB1") {
            isAdmin = true; myPos.admin = true; myPos.color = "#fbbf24";
            document.getElementById('admin-controls').style.display = 'block';
        }

        document.getElementById('entry-screen').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('entry-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
        }, 800);
        
        startNetworking();
    }

    function startNetworking() {
        const LOBBY_ID = "vibe-redux-main-2026";
        const host = new Peer(LOBBY_ID);
        host.on('open', () => {
            document.getElementById('status-text').innerText = "HOSTING LOBBY";
            host.on('connection', setupConn);
        });
        host.on('error', () => {
            const guest = new Peer();
            guest.on('open', () => {
                document.getElementById('status-text').innerText = "CONNECTED TO GLOBAL";
                setupConn(guest.connect(LOBBY_ID));
            });
        });
    }

    function setupConn(c) {
        conns.push(c);
        c.on('data', d => {
            if(d.type === 'sync') players[c.peer || "host"] = d.pos;
            if(d.type === 'chat') pushMsg(d.name, d.text, d.adm);
            if(d.type === 'bc') triggerBC(d.txt);
            if(d.type === 'mode') mode = d.val;
            if(d.type === 'meteors') triggerMeteors();
        });
    }

    // Controls
    const mouse = { x: canvas.width/2, y: canvas.height/2 };
    window.onmousemove = e => { mouse.x = e.clientX; mouse.y = e.clientY; };

    const chatInput = document.getElementById('chat-input');
    window.onkeydown = e => {
        if(e.key === 'Enter') {
            if(document.activeElement !== chatInput) {
                chatInput.focus();
            } else {
                handleInput();
            }
        }
    };

    function handleInput() {
        const val = chatInput.value.trim();
        if(!val) { chatInput.blur(); return; }

        if(val.startsWith('/announce ') && isAdmin) {
            const t = val.replace('/announce ', '');
            conns.forEach(c => c.send({type:'bc', txt: t}));
            triggerBC(t);
        } else if(val === '/meteors' && isAdmin) {
            conns.forEach(c => c.send({type:'meteors'}));
            triggerMeteors();
        } else if(['/nebula', '/vortex', '/clear'].includes(val) && isAdmin) {
            const m = val === '/clear' ? null : val.replace('/', '');
            conns.forEach(c => c.send({type:'mode', val: m}));
            mode = m;
        } else {
            conns.forEach(c => c.send({type:'chat', name: myPos.name, text: val, adm: isAdmin}));
            pushMsg(myPos.name, val, isAdmin);
            myPos.msg = val;
            setTimeout(() => { if(myPos.msg === val) myPos.msg = ""; }, 4000);
        }
        chatInput.value = ""; chatInput.blur();
    }

    function pushMsg(n, t, a) {
        const box = document.getElementById('messages');
        box.innerHTML += `<div><b style="color:${a?'var(--admin)':'var(--accent)'}">${n}</b>: ${t}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function triggerBC(t) {
        const bar = document.getElementById('announcement');
        bar.innerText = t; bar.style.top = '0px';
        setTimeout(() => bar.style.top = '-100px', 4000);
    }

    function triggerMeteors() {
        for(let i=0; i<20; i++) setTimeout(() => meteors.push({x:Math.random()*canvas.width, y:-20, v:Math.random()*10+10}), i*300);
    }

    function loop() {
        ctx.fillStyle = varColor('--bg');
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Nebula Mode Visuals
        if(mode === 'nebula') {
            hue = (hue + 1) % 360;
            const g = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width);
            g.addColorStop(0, `hsla(${hue}, 50%, 15%, 0.2)`); g.addColorStop(1, 'transparent');
            ctx.fillStyle = g; ctx.fillRect(0,0,canvas.width,canvas.height);
            myPos.color = `hsl(${hue}, 70%, 60%)`;
        } else {
            myPos.color = isAdmin ? "#fbbf24" : "#8b5cf6";
        }

        // Stars
        ctx.fillStyle = "#fff";
        stars.forEach(s => {
            s.y += s.z * 0.5;
            if(s.y > canvas.height) s.y = 0;
            ctx.globalAlpha = s.z / 3;
            ctx.beginPath(); ctx.arc(s.x, s.y, s.z/2, 0, 7); ctx.fill();
        });
        ctx.globalAlpha = 1;

        // Meteors
        ctx.strokeStyle = "rgba(255,255,255,0.4)";
        meteors.forEach((m, i) => {
            m.y += m.v; m.x -= m.v/2;
            ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x+15, m.y-15); ctx.stroke();
            if(m.y > canvas.height) meteors.splice(i, 1);
        });

        // Movement
        let tx = mouse.x, ty = mouse.y;
        if(mode === 'vortex') {
            tx = (mouse.x * 0.6) + (canvas.width/2 * 0.4);
            ty = (mouse.y * 0.6) + (canvas.height/2 * 0.4);
        }
        myPos.x += (tx - myPos.x) * 0.08;
        myPos.y += (ty - myPos.y) * 0.08;

        conns.forEach(c => c.send({type:'sync', pos: myPos}));
        players['me'] = myPos;

        for(let id in players) {
            const p = players[id];
            ctx.shadowBlur = p.admin ? 25 : 15; ctx.shadowColor = p.color;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, 7); ctx.fill();
            if(p.admin) { ctx.font = "14px Arial"; ctx.fillText("👑", p.x, p.y - 18); }
            ctx.shadowBlur = 0; ctx.fillStyle = "#fff"; ctx.font = "600 11px Inter"; ctx.textAlign = "center";
            ctx.fillText(p.name, p.x, p.y + 28);
            if(p.msg) {
                ctx.fillStyle = "rgba(255,255,255,0.9)";
                ctx.fillText(p.msg, p.x, p.y - 30);
            }
        }
        requestAnimationFrame(loop);
    }

    function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name); }
    loop();
</script>
</body>
</html>
