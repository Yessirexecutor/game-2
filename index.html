<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BETALOPIX | Instant Multiplayer</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #050608; --teal: #00f2ff; --purple: #bd00ff; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }

        /* AUTH SCREEN */
        #auth-layer { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: flex; justify-content: center; align-items: center; }
        .card { background: #111; padding: 40px; border-radius: 20px; border: 1px solid #333; text-align: center; }
        input { background: #000; border: 1px solid #444; color: white; padding: 12px; margin: 10px; border-radius: 8px; width: 220px; outline: none; }
        .btn { background: linear-gradient(45deg, var(--teal), var(--purple)); border: none; color: white; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* GAME WORLD */
        #game-layer { display: none; width: 100vw; height: 100vh; perspective: 1000px; background: #000; }
        .baseplate { width: 4000px; height: 4000px; background-image: radial-gradient(#222 1px, transparent 1px); background-size: 50px 50px; transform: rotateX(60deg) translate(-2000px, -2000px); position: absolute; top: 50%; left: 50%; }
        
        /* AVATARS */
        .avatar { position: absolute; transform-style: preserve-3d; transition: 0.1s linear; }
        .cube { width: 40px; height: 40px; background: var(--teal); border: 2px solid white; box-shadow: 0 0 15px var(--teal); }
        .tag { position: absolute; top: -30px; width: 100px; left: -30px; text-align: center; font-size: 12px; font-weight: bold; pointer-events: none; }
    </style>
</head>
<body>

    <div id="auth-layer">
        <div class="card">
            <h1 style="margin-top:0;">BETALOPIX</h1>
            <input type="text" id="u-name" placeholder="Enter Unique Name">
            <button class="btn" onclick="startLobby()">JOIN LOBBY</button>
            <p style="font-size: 10px; color: #555; margin-top: 20px;">No keys required. Peer-to-Peer active.</p>
        </div>
    </div>

    <div id="game-layer">
        <div class="baseplate"></div>
        <div id="players-container"></div>
    </div>

    <script>
        let myName = "";
        let myPeer = null;
        let myPos = { x: 0, y: 0 };
        let activeConnections = [];

        function startLobby() {
            myName = document.getElementById('u-name').value.trim();
            if(!myName) return alert("Enter a name!");

            // Create a unique Peer ID for this lobby
            myPeer = new Peer('btlp-lobby-' + myName);

            myPeer.on('open', (id) => {
                document.getElementById('auth-layer').style.display = 'none';
                document.getElementById('game-layer').style.display = 'block';
                spawnAvatar(myName);
                
                // Listen for others connecting to you
                myPeer.on('connection', (conn) => {
                    setupConn(conn);
                });

                // Auto-connect to everyone else (The "Lobby" part)
                // Note: In a real lobby, you'd need a list. 
                // For now, if you want to see someone, type their name in the console or use this 'broadcast' hack:
                console.log("Tell your friend to join as a different name!");
            });

            myPeer.on('error', (err) => {
                if(err.type === 'unavailable-id') alert("Name taken! Choose another.");
            });
        }

        function setupConn(conn) {
            conn.on('data', (data) => {
                updateAvatar(data.name, data.x, data.y);
            });
            activeConnections.push(conn);
        }

        function spawnAvatar(name) {
            const div = document.createElement('div');
            div.id = 'p-' + name;
            div.className = 'avatar';
            div.innerHTML = `<div class="tag">${name}</div><div class="cube"></div>`;
            if(name.toLowerCase() === 'betalopix') div.querySelector('.cube').style.background = 'var(--purple)';
            document.getElementById('players-container').appendChild(div);
        }

        function updateAvatar(name, x, y) {
            let el = document.getElementById('p-' + name);
            if(!el) { spawnAvatar(name); el = document.getElementById('p-' + name); }
            el.style.left = `calc(50% + ${x}px)`;
            el.style.top = `calc(50% + ${y}px)`;
        }

        // --- CONTROLS & SYNC ---
        document.addEventListener('keydown', (e) => {
            if(!myPeer) return;
            const s = 20;
            if(e.key === 'w') myPos.y -= s;
            if(e.key === 's') myPos.y += s;
            if(e.key === 'a') myPos.x -= s;
            if(e.key === 'd') myPos.x += s;

            // Move self
            updateAvatar(myName, myPos.x, myPos.y);

            // Send my position to everyone I'm connected to
            activeConnections.forEach(conn => {
                if(conn.open) {
                    conn.send({ name: myName, x: myPos.x, y: myPos.y });
                }
            });
        });

        // TO SEE OTHERS: You have to "Call" them. 
        // Usage: Connect('FriendName')
        window.Connect = function(friendName) {
            const conn = myPeer.connect('btlp-lobby-' + friendName);
            setupConn(conn);
            console.log("Attempting to link with " + friendName);
        };
    </script>
</body>
</html>
