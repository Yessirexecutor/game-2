<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VIBE_WORLD_SATELLITE_SABOTAGE</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #020205; --accent: #8b5cf6; --admin: #f59e0b; --glass: rgba(10, 10, 20, 0.85); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        #entry-screen { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .glass-card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 24px; text-align: center; backdrop-filter: blur(20px); width: 350px; }
        
        #hud { position: absolute; inset: 0; pointer-events: none; padding: 30px; display: none; flex-direction: column; justify-content: space-between; z-index: 10; }
        .panel { pointer-events: all; background: var(--glass); border: 1px solid rgba(255,255,255,0.05); padding: 15px 20px; border-radius: 16px; backdrop-filter: blur(10px); }
        
        #admin-controls { max-height: 120px; overflow-y: auto; border-color: var(--admin); color: var(--admin); font-size: 11px; display: none; scrollbar-width: none; }

        #chat-zone { width: 380px; }
        #messages { height: 120px; overflow-y: auto; font-size: 13px; margin-bottom: 12px; scrollbar-width: none; }
        #chat-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 10px; outline: none; }

        #announcement { position: fixed; top: -120px; left: 50%; transform: translateX(-50%); background: var(--admin); color: #000; padding: 15px 40px; border-radius: 0 0 20px 20px; font-weight: 900; z-index: 3000; transition: 0.6s; }
        canvas { display: block; }
        input { width: 100%; background: #000; color: #fff; border: 1px solid #333; padding: 12px; border-radius: 10px; margin-bottom: 15px; text-align: center; }
        button { width: 100%; background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="announcement">EVENT LOG</div>
<div id="entry-screen">
    <div class="glass-card">
        <h1 style="margin:0 0 20px 0; color: var(--accent);">VIBE WORLD</h1>
        <input type="text" id="username" placeholder="NAME">
        <input type="password" id="pass" placeholder="KEY">
        <button onclick="init()">WAKE UP</button>
    </div>
</div>

<canvas id="canvas"></canvas>
<audio id="bg-music" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<div id="hud">
    <div style="display: flex; justify-content: space-between;">
        <div class="panel"><b id="status-text" style="color:var(--accent)">LINKING...</b></div>
        <div id="admin-controls" class="panel">
            <b>STORY MODE</b><br>
            • /story - Launch Sequence<br>
            • /shockwave | /nebula | /vortex | /clear
        </div>
    </div>
    <div id="chat-zone" class="panel">
        <div id="messages"></div>
        <input type="text" id="chat-input" placeholder="Type message...">
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const music = document.getElementById('bg-music');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;

    let myPos = { x: canvas.width/2, y: canvas.height/2, name: "", color: "#8b5cf6", admin: false, msg: "" };
    let stars = [], players = {}, conns = [], peer = new Peer();
    let mode = null, isAdmin = false, waveRadius = 0;
    
    // Story States
    let storyPhase = 0, storyTimer = 0, shakeAmount = 0;
    let bigAsteroid = { x: 0, y: 0 };
    const dialogue = [
        { t: "Pilot A", m: "Hey... are you sure this is the right idea?", d: 3000 },
        { t: "Pilot B", m: "Well yeah, it has to be. Shooting the meteor down is the only way.", d: 4000 },
        { t: "Pilot A", m: "Well... I hope the satellite people are okay...", d: 3000 }
    ];

    for(let i=0; i<250; i++) stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, z: Math.random()*2 + 1 });

    function init() {
        const name = document.getElementById('username').value;
        const pass = document.getElementById('pass').value;
        if(!name) return;
        myPos.name = name;
        if(pass === "BIB1") { isAdmin = true; myPos.admin = true; myPos.color = "#f59e0b"; document.getElementById('admin-controls').style.display = 'block'; }
        document.getElementById('entry-screen').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        music.play().catch(() => {});
        startNet();
    }

    function startNet() {
        const LOBBY = "vibe-satellite-sabotage-2026";
        const host = new Peer(LOBBY);
        host.on('open', () => { document.getElementById('status-text').innerText = "HOST"; host.on('connection', setup); });
        host.on('error', () => {
            const guest = new Peer();
            guest.on('open', () => { setup(guest.connect(LOBBY)); document.getElementById('status-text').innerText = "STATION ONLINE"; });
        });
    }

    function setup(c) {
        conns.push(c);
        c.on('data', d => {
            if(d.type === 'sync') players[c.peer || "host"] = d.pos;
            if(d.type === 'chat') pushMsg(d.name, d.text, d.adm);
            if(d.type === 'bc') triggerBC(d.txt);
            if(d.type === 'mode') mode = d.val;
            if(d.type === 'shock') waveRadius = 1;
            if(d.type === 'story') triggerStory();
        });
    }

    function handleInput() {
        const chatInput = document.getElementById('chat-input');
        if(document.activeElement !== chatInput) { chatInput.focus(); return; }
        const val = chatInput.value.trim();
        if(!val) { chatInput.blur(); return; }

        if(val === '/story' && isAdmin) { conns.forEach(c => c.send({type:'story'})); triggerStory(); }
        else if(val === '/shockwave' && isAdmin) { conns.forEach(c => c.send({type:'shock'})); waveRadius = 1; }
        else if(['/nebula', '/vortex', '/clear'].includes(val) && isAdmin) { mode = val === '/clear' ? null : val.replace('/', ''); conns.forEach(c => c.send({type:'mode', val: mode})); }
        else { conns.forEach(c => c.send({type:'chat', name: myPos.name, text: val, adm: isAdmin})); pushMsg(myPos.name, val, isAdmin); myPos.msg = val; setTimeout(() => { if(myPos.msg === val) myPos.msg = ""; }, 4000); }
        chatInput.value = ""; chatInput.blur();
    }

    function triggerStory() { storyPhase = 1; storyTimer = Date.now(); bigAsteroid = { x: canvas.width + 500, y: -300 }; }

    function runStory() {
        if (storyPhase === 0) return;
        let elapsed = Date.now() - storyTimer;
        
        // ACT 1: THE BRIDGE DIALOGUE
        if (storyPhase === 1) {
            ctx.fillStyle = "rgba(0,0,0,0.8)";
            ctx.fillRect(0,0,canvas.width,canvas.height);
            
            // Draw Pilot Silhouettes
            ctx.fillStyle = "#111";
            ctx.fillRect(canvas.width*0.2, canvas.height*0.6, 60, 80);
            ctx.fillRect(canvas.width*0.7, canvas.height*0.6, 60, 80);

            let currentLine = 0;
            if (elapsed > 3000) currentLine = 1;
            if (elapsed > 7000) currentLine = 2;
            
            if (elapsed < 10000) {
                ctx.fillStyle = "white";
                ctx.font = "bold 18px monospace";
                ctx.textAlign = "center";
                ctx.fillText(dialogue[currentLine].t + ":", canvas.width/2, canvas.height/2 - 30);
                ctx.font = "22px Inter";
                ctx.fillText('"' + dialogue[currentLine].m + '"', canvas.width/2, canvas.height/2 + 20);
            } else {
                storyPhase = 2; storyTimer = Date.now();
            }
        } 
        // ACT 2: THE METEOR FLYBY
        else if (storyPhase === 2) {
            shakeAmount = 5;
            bigAsteroid.x -= 25; bigAsteroid.y += 15;
            let g = ctx.createRadialGradient(bigAsteroid.x, bigAsteroid.y, 0, bigAsteroid.x, bigAsteroid.y, 200);
            g.addColorStop(0, '#fff'); g.addColorStop(0.3, '#ff0'); g.addColorStop(1, 'transparent');
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bigAsteroid.x, bigAsteroid.y, 200, 0, 7); ctx.fill();

            if (elapsed > 2000) {
                ctx.fillStyle = `rgba(255, 255, 255, ${(elapsed-2000)/2000})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            if (elapsed > 4000) { storyPhase = 3; storyTimer = Date.now(); }
        }
        // ACT 3: BLACKOUT & AWAKENING
        else if (storyPhase === 3) {
            shakeAmount = 0; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#fff"; ctx.font = "italic 600 28px serif"; ctx.textAlign = "center";
            let alpha = elapsed < 2000 ? elapsed / 2000 : 1 - ((elapsed - 3000) / 2000);
            ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
            ctx.fillText("Hey, you. You're finally awake.", canvas.width/2, canvas.height/2);
            ctx.globalAlpha = 1.0;
            if (elapsed > 6000) { storyPhase = 4; storyTimer = Date.now(); }
        } 
        else if (storyPhase === 4) {
            ctx.fillStyle = `rgba(0, 0, 0, ${1 - (elapsed / 2000)})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (elapsed > 2000) storyPhase = 0;
        }
    }

    function pushMsg(n, t, a) { const b = document.getElementById('messages'); b.innerHTML += `<div><b style="color:${a?'var(--admin)':'var(--accent)'}">${n}</b>: ${t}</div>`; b.scrollTop = b.scrollHeight; }
    function triggerBC(t) { const a = document.getElementById('announcement'); a.innerText = t; a.style.top = '0px'; setTimeout(() => a.style.top = '-120px', 4000); }

    function loop() {
        if (shakeAmount > 0) { ctx.save(); ctx.translate((Math.random()-0.5)*shakeAmount, (Math.random()-0.5)*shakeAmount); }
        ctx.fillStyle = "#020205"; ctx.fillRect(0, 0, canvas.width, canvas.height);

        stars.forEach(s => { s.y += s.z * 0.5; if(s.y > canvas.height) s.y = 0; ctx.globalAlpha = s.z/3; ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(s.x, s.y, s.z/2, 0, 7); ctx.fill(); });

        if(waveRadius > 0) {
            waveRadius += 25; ctx.strokeStyle = `rgba(255,255,255,${1 - waveRadius/canvas.width})`; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, waveRadius, 0, 7); ctx.stroke();
            const dx = myPos.x - canvas.width/2, dy = myPos.y - canvas.height/2, d = Math.sqrt(dx*dx + dy*dy);
            if(Math.abs(d - waveRadius) < 40) { myPos.x += (dx/d)*70; myPos.y += (dy/d)*70; }
            if(waveRadius > canvas.width * 1.5) waveRadius = 0;
        }

        let tx = mouse.x, ty = mouse.y;
        if(mode === 'vortex') { tx = (mouse.x*0.6)+(canvas.width/2*0.4); ty = (mouse.y*0.6)+(canvas.height/2*0.4); }
        myPos.x += (tx - myPos.x) * 0.08; myPos.y += (ty - myPos.y) * 0.08;

        runStory();
        conns.forEach(c => c.send({type:'sync', pos: myPos}));
        players['me'] = myPos;

        if (storyPhase === 0) {
            for(let id in players) {
                const p = players[id]; ctx.shadowBlur = 15; ctx.shadowColor = p.color; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, 7); ctx.fill();
                ctx.shadowBlur = 0; ctx.fillStyle = "#fff"; ctx.font = "600 11px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(p.name, p.x, p.y + 28); if(p.msg) ctx.fillText(p.msg, p.x, p.y - 30);
            }
        }
        
        if (shakeAmount > 0) ctx.restore();
        requestAnimationFrame(loop);
    }
    window.onkeydown = e => { if(e.key === 'Enter') handleInput(); };
    loop();
</script>
</body>
</html>
